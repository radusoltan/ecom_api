services:
    # Override Payment Gateways with Fake implementations for testing
    # This prevents actual API calls to Stripe/PayPal during tests

    # Completely replace StripePaymentGateway with FakeStripeGateway
    App\Payment\Infrastructure\Gateway\StripePaymentGateway:
        class: App\Payment\Infrastructure\Gateway\FakeStripeGateway
        public: false
        autowire: false
        autoconfigure: false
        arguments:
            $logger: '@logger'

    # Completely replace PayPalPaymentGateway with FakePayPalGateway
    App\Payment\Infrastructure\Gateway\PayPalPaymentGateway:
        class: App\Payment\Infrastructure\Gateway\FakePayPalGateway
        public: false
        autowire: false
        autoconfigure: false
        arguments:
            $logger: '@logger'
