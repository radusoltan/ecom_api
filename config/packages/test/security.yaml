security:
    # Enable JWT authentication in test environment.
    # Uses the standard BlindIndexUserProvider (same as production).
    # The UserBlindIndexListener auto-generates blind indexes on persist,
    # so test-created users are always findable by the user provider.
    firewalls:
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~
