api_platform:
    title: 'E-Commerce Multi-Tenant API'
    version: '1.0.0'
    description: 'DDD/CQRS E-Commerce Platform API - v1'
    formats:
        jsonld: ['application/ld+json']
        json: ['application/json']
        multipart: ['multipart/form-data']
    error_formats:
        jsonproblem: ['application/problem+json']
        jsonld: ['application/ld+json']
        json: ['application/json']
    exception_to_status:
        App\Cart\Domain\Exception\CartNotFoundException: 404
        App\Cart\Domain\Exception\CartItemNotFoundException: 404
        App\Catalog\Domain\Exception\ProductNotFoundException: 404
        App\Catalog\Domain\Exception\CategoryNotFoundException: 404
        App\Tenant\Domain\Exception\TenantNotFoundException: 404
        App\Cart\Domain\Exception\InsufficientStockException: 409
        App\Tenant\Domain\Exception\TenantAlreadyExistsException: 409
        App\User\Domain\Exception\EmailAlreadyExistsException: 409
        App\User\Domain\Exception\UsernameAlreadyExistsException: 409
        App\Shipping\Domain\Exception\InvalidShipmentTransitionException: 409
        App\Cart\Domain\Exception\InvalidQuantityException: 400
        App\Shared\Domain\Exception\InvalidLanguageCodeException: 400
        App\Payment\Domain\Exception\InvalidPaymentMethodException: 400
        App\Payment\Domain\Exception\UnsupportedPaymentMethodException: 400
        App\Order\Domain\Exception\CheckoutValidationException: 422
        App\Payment\Domain\Exception\CardDeclinedException: 402
        App\Payment\Domain\Exception\InsufficientFundsException: 402
        App\Payment\Domain\Exception\PaymentGatewayException: 402
    patch_formats:
        json: ['application/merge-patch+json']
    docs_formats:
        jsonld: ['application/ld+json']
        jsonopenapi: ['application/vnd.openapi+json']
        html: ['text/html']
    defaults:
        stateless: true
        pagination_items_per_page: 30
        pagination_maximum_items_per_page: 100
        pagination_client_items_per_page: true
        pagination_client_enabled: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Accept', 'Accept-Language', 'X-Tenant-ID']
            max_age: 60  # Cache for 60 seconds
            shared_max_age: 300  # Shared cache (CDN) for 5 minutes
            public: true  # Allow caching by CDN/proxies for public endpoints
        extra_properties:
            standard_put: false
    resource_class_directories:
        - '%kernel.project_dir%/src/AuditLog/Infrastructure/Persistence/Doctrine/Entity'
    # GraphQL Support
    graphql:
        enabled: true
        graphiql:
            enabled: true
        default_ide: graphiql
        nesting_separator: _
