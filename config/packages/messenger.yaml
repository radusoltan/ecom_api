framework:
    messenger:
        default_bus: command.bus

        # Define multiple message buses
        buses:
            command.bus:
                middleware:
                    - App\Shared\Infrastructure\Messenger\TenantContextMiddleware
                    - doctrine_transaction
            query.bus:
                middleware:
                    - App\Shared\Infrastructure\Messenger\TenantContextMiddleware
                    - doctrine_transaction
            event.bus:
                default_middleware: allow_no_handlers
                middleware:
                    - App\Shared\Infrastructure\Messenger\TenantContextMiddleware
                    - doctrine_transaction

        # Uncomment this (and the failed transport below) to send failed messages to this transport for later handling.
        # failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    auto_setup: true
                    queues:
                        async: ~
                retry_strategy:
                    max_retries: 3
                    delay: 1000

            media_async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    auto_setup: true
                    queues:
                        media: ~
                retry_strategy:
                    max_retries: 3
                    delay: 2000

            # Payment events queue - async processing
            payment_events:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    auto_setup: true
                    queues:
                        payment_events: ~
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2

            # Order events queue - async processing
            order_events:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    auto_setup: true
                    queues:
                        order_events: ~
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2

            # Inventory events queue - for stock allocation
            inventory_events:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    auto_setup: true
                    queues:
                        inventory_events: ~
                retry_strategy:
                    max_retries: 5
                    delay: 2000
                    multiplier: 2

            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        failure_transport: failed

        routing:
            # Route your messages to the transports (if needed)
            # All handlers are synchronous by default via services.yaml tags

            # Media Messages
            'App\Media\Application\Message\GenerateThumbnailsMessage': media_async
            'App\Media\Application\Message\DeleteImageAssetsMessage': media_async

            # Payment Domain Events - async via RabbitMQ
            'App\Payment\Domain\Event\PaymentCaptured': payment_events
            'App\Payment\Domain\Event\PaymentAuthorized': payment_events
            'App\Payment\Domain\Event\PaymentRefunded': payment_events
            'App\Payment\Domain\Event\PaymentFailed': payment_events
            'App\Payment\Domain\Event\PaymentCancelled': payment_events

            # Order Domain Events - async via RabbitMQ
            'App\Order\Domain\Event\OrderPlaced': order_events
            'App\Order\Domain\Event\OrderPaid': order_events
            'App\Order\Domain\Event\OrderStatusChanged': order_events
            'App\Order\Domain\Event\OrderCancelled': order_events
            'App\Order\Domain\Event\FulfillmentStatusChanged': order_events

            # Returns Domain Events - synchronous processing
            'App\Returns\Domain\Event\ReturnRequestCreated': sync
            'App\Returns\Domain\Event\ReturnRequestApproved': sync
            'App\Returns\Domain\Event\ReturnRequestRejected': sync
            'App\Returns\Domain\Event\ReturnRequestReceived': sync
            'App\Returns\Domain\Event\ReturnRequestInspected': sync
            'App\Returns\Domain\Event\ReturnRequestCompleted': sync

            # Async email sending (Symfony Mailer)
            'Symfony\Component\Mailer\Messenger\SendEmailMessage': async

