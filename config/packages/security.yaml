security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Role Hierarchy - defines which roles inherit permissions from others
    # https://symfony.com/doc/current/security.html#hierarchical-roles
    role_hierarchy:
        # Admin Panel Hierarchy
        ROLE_VIEWER:        ROLE_USER            # Viewer inherits base user privileges
        ROLE_MANAGER:       ROLE_USER            # Manager inherits base user privileges
        ROLE_ADMIN:         ROLE_MANAGER         # Admin inherits manager privileges
        ROLE_SUPER_ADMIN:   ROLE_ADMIN           # Super Admin inherits admin privileges

        # Tenant & Business Hierarchy
        ROLE_TENANT_USER:   ROLE_USER            # Tenant user inherits base privileges
        ROLE_TENANT_ADMIN:  ROLE_MANAGER         # Tenant admin similar to manager
        ROLE_VENDOR:        ROLE_USER            # Vendor inherits base privileges
        ROLE_CUSTOMER:      ROLE_USER            # Customer inherits base privileges

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\User\Infrastructure\Persistence\Doctrine\Entity\UserEntity
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        login:
            pattern: ^/api/login
            stateless: true
            provider: app_user_provider
            json_login:
                check_path: /api/login_check
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
        # Commenting out for now - these firewalls bypass authentication
        # Uncomment in production if you need public API endpoints
        # search:
        #     pattern: ^/api/search
        #     security: false
        # public_api:
        #     pattern: ^/api/(product_entities|category_entities|warehouses|price_lists|tenants)
        #     security: false
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~
        main:
            lazy: true
            provider: app_user_provider

            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/login_check, roles: PUBLIC_ACCESS }  # JWT login endpoint
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }  # Allow access to API documentation
        - { path: ^/api/translations, roles: PUBLIC_ACCESS }  # Allow access to translations (UI strings)
        - { path: ^/api/v1/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/docs, roles: PUBLIC_ACCESS }  # Allow access to API documentation
        - { path: ^/api/v1/translations, roles: PUBLIC_ACCESS }  # Allow access to translations
        - { path: ^/api/v1/storefront, roles: PUBLIC_ACCESS }  # Allow public access to storefront endpoints
        - { path: ^/api/v1/categories, roles: PUBLIC_ACCESS }  # Allow public access to categories for storefront
        - { path: ^/api/v1/category_entities, roles: PUBLIC_ACCESS }  # Allow public access to category entities for storefront filters
        - { path: ^/api/v1/product_entities, roles: PUBLIC_ACCESS }  # Allow public access to products for storefront
        - { path: ^/api/v1/search/products, roles: PUBLIC_ACCESS }  # Allow public access to products for storefront
        - { path: ^/api/product-options, roles: PUBLIC_ACCESS }  # Allow public access to product options for storefront filters
        - { path: ^/api/v1/product-options, roles: PUBLIC_ACCESS }  # Allow public access to product options for storefront filters (v1)
        - { path: ^/api/customers, roles: PUBLIC_ACCESS, methods: [POST] }  # Allow public customer registration
        - { path: ^/api/v1/customers, roles: PUBLIC_ACCESS, methods: [POST] }  # Allow public customer registration (v1)
        - { path: ^/api/v1/orders, roles: PUBLIC_ACCESS, methods: [POST] }  # Allow public place orders
        - { path: ^/api/v1/orders, roles: PUBLIC_ACCESS, methods: [GET] }  # Allow public get orders (collection and item)
        - { path: ^/api/orders, roles: PUBLIC_ACCESS, methods: [POST] }  # Allow public place orders (no v1)
        - { path: ^/api/orders, roles: PUBLIC_ACCESS, methods: [GET] }  # Allow public get orders (no v1, collection and item)
        - { path: ^/api/payments/stripe/create-intent, roles: PUBLIC_ACCESS }  # Allow public payment intent creation
        - { path: ^/api/payments/stripe/verify-payment, roles: PUBLIC_ACCESS }  # Allow public payment verification
        - { path: ^/api/payments/stripe/capture-after-success, roles: PUBLIC_ACCESS }  # Allow public payment capture (dev only)
        - { path: ^/api/payments/stripe/webhook, roles: PUBLIC_ACCESS }  # Allow Stripe webhooks
        - { path: ^/api/webhooks/stripe, roles: PUBLIC_ACCESS }  # Allow Stripe webhooks (alternative path)
        - { path: ^/api/payments, roles: PUBLIC_ACCESS, methods: [POST] }  # Allow public payment creation
        - { path: ^/api/v1/payments, roles: PUBLIC_ACCESS, methods: [POST] }  # Allow public payment creation (v1)
        - { path: ^/api/payments/paypal, roles: PUBLIC_ACCESS }  # Allow public PayPal payment operations
        - { path: ^/api/v1/payments/paypal, roles: PUBLIC_ACCESS }  # Allow public PayPal payment operations (v1)
        - { path: ^/api/payments/2checkout, roles: PUBLIC_ACCESS }  # Allow public 2Checkout payment operations
        - { path: ^/api/v1/payments/2checkout, roles: PUBLIC_ACCESS }  # Allow public 2Checkout payment operations (v1)
        - { path: ^/api/v1/payments/stripe/create-intent, roles: PUBLIC_ACCESS }  # Allow public payment intent creation (v1)
        - { path: ^/api/v1/payments/stripe/verify-payment, roles: PUBLIC_ACCESS }  # Allow public payment verification (v1)
        - { path: ^/api/v1/payments/stripe/capture-after-success, roles: PUBLIC_ACCESS }  # Allow public payment capture (v1, dev only)
        - { path: ^/api/v1/payments/stripe/webhook, roles: PUBLIC_ACCESS }  # Allow Stripe webhooks (v1)
        - { path: ^/api/v1/webhooks/stripe, roles: PUBLIC_ACCESS }  # Allow Stripe webhooks (v1)
        - { path: ^/api/v1/dashboard/stats, roles: PUBLIC_ACCESS }  # Allow public access to dashboard stats (dev only)
        - { path: ^/api/v1/inventory/stats, roles: PUBLIC_ACCESS }  # Allow public access to inventory stats (dev only)
        - { path: ^/api/stock-items, roles: PUBLIC_ACCESS }  # Allow public access to stock items (dev only)
        - { path: ^/api/v1/stock-items, roles: PUBLIC_ACCESS }  # Allow public access to stock items v1 (dev only)
        - { path: ^/api/v1/validate-coupon, roles: PUBLIC_ACCESS }  # Allow public coupon validation for shopping cart
        - { path: ^/api/v1/variant_entities, roles: PUBLIC_ACCESS }  # Allow public access to variants (dev only)
        - { path: ^/api/variant_entities, roles: PUBLIC_ACCESS }  # Allow public access to variants (dev only - no v1)
        - { path: ^/api/v1/product-options, roles: PUBLIC_ACCESS }  # Allow public access to product options (dev only)
        - { path: ^/api/product-options, roles: PUBLIC_ACCESS }  # Allow public access to product options (dev only - no v1)
        - { path: ^/api/v1/product-option-values, roles: PUBLIC_ACCESS }  # Allow public access to product option values (dev only)
        - { path: ^/api/product-option-values, roles: PUBLIC_ACCESS }  # Allow public access to product option values (dev only - no v1)
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
