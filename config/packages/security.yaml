security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Role Hierarchy - defines which roles inherit permissions from others
    # https://symfony.com/doc/current/security.html#hierarchical-roles
    role_hierarchy:
        # Admin Panel Hierarchy
        ROLE_VIEWER:        ROLE_USER            # Viewer inherits base user privileges
        ROLE_MANAGER:       ROLE_USER            # Manager inherits base user privileges
        ROLE_ADMIN:         ROLE_MANAGER         # Admin inherits admin privileges
        ROLE_SUPER_ADMIN:   ROLE_ADMIN           # Super Admin inherits admin privileges

        # Tenant & Business Hierarchy
        ROLE_TENANT_USER:   ROLE_USER            # Tenant user inherits base privileges
        ROLE_TENANT_ADMIN:  ROLE_MANAGER         # Tenant admin similar to manager
        ROLE_VENDOR:        ROLE_USER            # Vendor inherits base privileges
        ROLE_CUSTOMER:      ROLE_USER            # Customer inherits base privileges

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            id: App\User\Infrastructure\Security\BlindIndexUserProvider
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        login:
            pattern: ^/api/login
            stateless: true
            provider: app_user_provider
            json_login:
                check_path: /api/login_check
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~
        main:
            lazy: true
            provider: app_user_provider

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        # === Authentication endpoints (4 entries) ===
        - { path: ^/api/login, roles: PUBLIC_ACCESS }             # JWT login + login_check
        - { path: ^/api/v1/auth, roles: PUBLIC_ACCESS }           # register, token/refresh, password
        - { path: ^/api/v1/mfa/verify, roles: IS_AUTHENTICATED_FULLY }

        # === API Documentation (1 entry) ===
        - { path: ^/api/(v1/)?docs, roles: PUBLIC_ACCESS }

        # === Public storefront read endpoints (6 entries — GET only) ===
        - { path: ^/api/v1/storefront, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/v1/categor, roles: PUBLIC_ACCESS, methods: [GET] }          # categories + category_entities
        - { path: ^/api/v1/product, roles: PUBLIC_ACCESS, methods: [GET] }           # product_entities, product-options, product-option-values
        - { path: ^/api/v1/variant_entities, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/v1/search, roles: PUBLIC_ACCESS, methods: [GET] }            # products + autocomplete
        - { path: ^/api/v1/translations, roles: PUBLIC_ACCESS, methods: [GET] }

        # === Guest-safe fulfillment tracking (1 entry — GET only, RLS-scoped) ===
        - { path: ^/api/v1/fulfillments, roles: PUBLIC_ACCESS, methods: [GET] }

        # === Guest checkout (4 entries — POST only where applicable) ===
        - { path: ^/api/v1/cart, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/customers, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/v1/orders, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/v1/validate-coupon, roles: PUBLIC_ACCESS, methods: [POST] }

        # === Payment (1 entry — Stripe guest checkout flow) ===
        - { path: ^/api/v1/payments/stripe, roles: PUBLIC_ACCESS, methods: [POST, GET] }

        # === Webhooks (1 entry — signature-verified server-to-server) ===
        - { path: ^/api/v1/webhooks, roles: PUBLIC_ACCESS, methods: [POST] }

        # === Authenticated endpoints ===
        - { path: ^/api/v1/orders, roles: IS_AUTHENTICATED_FULLY, methods: [GET] }
        - { path: ^/api/v1/profile, roles: IS_AUTHENTICATED_FULLY }

        # === Catch-all: require authentication for all other API endpoints ===
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
