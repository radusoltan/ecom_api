security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Role Hierarchy - defines which roles inherit permissions from others
    # https://symfony.com/doc/current/security.html#hierarchical-roles
    role_hierarchy:
        # Admin Panel Hierarchy
        ROLE_VIEWER:        ROLE_USER            # Viewer inherits base user privileges
        ROLE_MANAGER:       ROLE_USER            # Manager inherits base user privileges
        ROLE_ADMIN:         ROLE_MANAGER         # Admin inherits admin privileges
        ROLE_SUPER_ADMIN:   ROLE_ADMIN           # Super Admin inherits admin privileges

        # Tenant & Business Hierarchy
        ROLE_TENANT_USER:   ROLE_USER            # Tenant user inherits base privileges
        ROLE_TENANT_ADMIN:  ROLE_MANAGER         # Tenant admin similar to manager
        ROLE_VENDOR:        ROLE_USER            # Vendor inherits base privileges
        ROLE_CUSTOMER:      ROLE_USER            # Customer inherits base privileges

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            id: App\User\Infrastructure\Security\BlindIndexUserProvider
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        login:
            pattern: ^/api/login
            stateless: true
            provider: app_user_provider
            json_login:
                check_path: /api/login_check
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~
        main:
            lazy: true
            provider: app_user_provider

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        # === Authentication endpoints ===
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/login_check, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/auth/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/auth/token/refresh, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/auth/password, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/mfa/verify, roles: IS_AUTHENTICATED_FULLY }

        # === API Documentation ===
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/docs, roles: PUBLIC_ACCESS }

        # === Public storefront read endpoints (products, categories, search) ===
        - { path: ^/api/v1/storefront, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/categories, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/category_entities, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/product_entities, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/product-options, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/product-option-values, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/variant_entities, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/search/products, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/search/autocomplete, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/translations, roles: PUBLIC_ACCESS }

        # === Guest checkout: cart, customer registration, order creation ===
        - { path: ^/api/v1/cart, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/customers, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/v1/orders, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/v1/validate-coupon, roles: PUBLIC_ACCESS }

        # === Payment intent creation (needed for guest checkout Stripe flow) ===
        - { path: ^/api/v1/payments/stripe/create-intent, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/payments/stripe/verify-payment, roles: PUBLIC_ACCESS }

        # === Webhook endpoints (signature-verified server-to-server) ===
        - { path: ^/api/v1/webhooks/stripe, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/webhooks/paypal, roles: PUBLIC_ACCESS }

        # === Authenticated endpoints ===
        - { path: ^/api/v1/orders, roles: IS_AUTHENTICATED_FULLY, methods: [GET] }
        - { path: ^/api/v1/profile, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/v1/profile/addresses, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/v1/profile/payment-methods, roles: IS_AUTHENTICATED_FULLY }

        # === Catch-all: require authentication for all other API endpoints ===
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
