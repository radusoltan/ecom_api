framework:
    cache:
        pools:
            cache.rate_limiter:
                adapter: cache.adapter.redis
                provider: 'redis://localhost:6379/3'  # Use DB 3 for rate limiting

    rate_limiter:
        # Stock operations rate limiter - per user/IP
        stock_operations:
            policy: 'sliding_window'
            limit: 100
            interval: '1 minute'

        # Stock operations per tenant - prevent single tenant abuse
        stock_operations_per_tenant:
            policy: 'sliding_window'
            limit: 1000
            interval: '1 minute'

        # Stock reservation rate limiter - more restrictive
        stock_reservations:
            policy: 'token_bucket'
            limit: 50
            rate:
                interval: '1 minute'
                amount: 50

        # Bulk operations - very restrictive
        bulk_operations:
            policy: 'fixed_window'
            limit: 10
            interval: '1 minute'

        # Order placement rate limiter - prevent checkout abuse
        # Per IP + per tenant to prevent spam/brute force
        orders_place:
            policy: 'sliding_window'
            limit: 10
            interval: '1 minute'

        # Order operations per tenant - global tenant throttling
        orders_per_tenant:
            policy: 'sliding_window'
            limit: 100
            interval: '1 minute'

        # Public API - unauthenticated requests (per IP)
        api_public:
            policy: 'sliding_window'
            limit: 100
            interval: '1 minute'

        # Authenticated API - general tenant operations
        api_authenticated:
            policy: 'sliding_window'
            limit: 1000
            interval: '1 minute'

        # Admin API - administrative operations (per user)
        api_admin:
            policy: 'sliding_window'
            limit: 500
            interval: '1 minute'

        # Search API - per tenant to prevent search spam
        api_search:
            policy: 'sliding_window'
            limit: 200
            interval: '1 minute'

        # Checkout API - per session, very restrictive
        api_checkout:
            policy: 'token_bucket'
            limit: 50
            interval: '1 minute'
            rate:
                interval: '1 minute'
                amount: 50
