parameters:
    payment.stripe.api_key: '%env(STRIPE_SECRET_KEY)%'
    payment.stripe.webhook_secret: '%env(STRIPE_WEBHOOK_SECRET)%'
    payment.stripe.api_version: '2024-12-18'
    payment.paypal.client_id: '%env(PAYPAL_CLIENT_ID)%'
    payment.paypal.client_secret: '%env(PAYPAL_SECRET_KEY)%'
    payment.paypal.environment: '%env(PAYPAL_ENVIRONMENT)%'
    payment.paypal.webhook_id: '%env(PAYPAL_WEBHOOK_ID)%'
    payment.refund.window_days: 180
    payment.refund.max_per_payment: 10
    payment.refund.approval_threshold: 10000
