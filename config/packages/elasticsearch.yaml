# Elasticsearch configuration
parameters:
    elasticsearch.host: '%env(ELASTICSEARCH_HOST)%'
    elasticsearch.user: '%env(ELASTICSEARCH_USER)%'
    elasticsearch.password: '%env(ELASTICSEARCH_PASSWORD)%'
    elasticsearch.verify_ssl: '%env(bool:ELASTICSEARCH_VERIFY_SSL)%'

services:
    # Elasticsearch Client
    Elastic\Elasticsearch\Client:
        factory: ['App\Shared\Infrastructure\Elasticsearch\ElasticsearchClientFactory', 'create']
        arguments:
            $host: '%elasticsearch.host%'
            $user: '%elasticsearch.user%'
            $password: '%elasticsearch.password%'
            $verifySsl: '%elasticsearch.verify_ssl%'

    # Alias for easier injection
    elasticsearch.client:
        alias: Elastic\Elasticsearch\Client

when@test:
    services:
        Elastic\Elasticsearch\Client:
            factory: ['App\Shared\Infrastructure\Elasticsearch\ElasticsearchClientFactory', 'create']
            arguments:
                $host: '%elasticsearch.host%'
                $user: '%elasticsearch.user%'
                $password: '%elasticsearch.password%'
                $verifySsl: '%elasticsearch.verify_ssl%'
            public: true

        # Make Elasticsearch services public in test environment for functional tests
        App\Shared\Infrastructure\Elasticsearch\IndexManager:
            autowire: true
            public: true

        App\Catalog\Infrastructure\Elasticsearch\ProductIndexer:
            autowire: true
            public: true

        App\Catalog\Infrastructure\Elasticsearch\CategoryIndexer:
            autowire: true
            public: true
