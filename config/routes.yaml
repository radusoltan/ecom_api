controllers:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute

# Payment webhook controllers
payment_webhooks:
    resource:
        path: ../src/Payment/Presentation/Api/Controller/
        namespace: App\Payment\Presentation\Api\Controller
    type: attribute

# Pricing controllers
pricing_controllers:
    resource:
        path: ../src/Pricing/Presentation/Api/Controller/
        namespace: App\Pricing\Presentation\Api\Controller
    type: attribute

# Internationalization controllers (translation tools)
i18n_controllers:
    resource:
        path: ../src/Internationalization/Infrastructure/ApiPlatform/Controller/
        namespace: App\Internationalization\Infrastructure\ApiPlatform\Controller
    type: attribute

# User controllers (MFA, etc.)
user_controllers:
    resource:
        path: ../src/User/Presentation/Api/Controller/
        namespace: App\User\Presentation\Api\Controller
    type: attribute

api_login_check:
    path: /api/login_check
