    App\Payment\Presentation\Api\Processor\RefundPaymentProcessor: ~
    App\Payment\Presentation\Api\Processor\CancelPaymentProcessor: ~

    # Payment Context - State Providers (inner services)
    App\Payment\Presentation\Api\Provider\PaymentItemProvider: ~
    App\Payment\Presentation\Api\Provider\PaymentCollectionProvider: ~

    # Decorate Payment providers with TenantContext
    tenant_context_payment_item_provider:
        class: App\Shared\Infrastructure\ApiPlatform\State\TenantContextProvider
        decorates: App\Payment\Presentation\Api\Provider\PaymentItemProvider
        decoration_priority: 100
        arguments:
            $decorated: '@.inner'
            $requestStack: '@request_stack'

    tenant_context_payment_collection_provider:
        class: App\Shared\Infrastructure\ApiPlatform\State\TenantContextProvider
        decorates: App\Payment\Presentation\Api\Provider\PaymentCollectionProvider
        decoration_priority: 100
        arguments:
            $decorated: '@.inner'
            $requestStack: '@request_stack'

    # Decorate Payment processors with TenantContext
    tenant_context_create_payment_processor:
        class: App\Shared\Infrastructure\ApiPlatform\State\TenantContextProcessor
        decorates: App\Payment\Presentation\Api\Processor\CreatePaymentProcessor
        decoration_priority: 100
        arguments:
            $decorated: '@.inner'
            $requestStack: '@request_stack'

    tenant_context_authorize_payment_processor:
        class: App\Shared\Infrastructure\ApiPlatform\State\TenantContextProcessor
        decorates: App\Payment\Presentation\Api\Processor\AuthorizePaymentProcessor
        decoration_priority: 100
        arguments:
            $decorated: '@.inner'
            $requestStack: '@request_stack'

    tenant_context_capture_payment_processor:
        class: App\Shared\Infrastructure\ApiPlatform\State\TenantContextProcessor
        decorates: App\Payment\Presentation\Api\Processor\CapturePaymentProcessor
        decoration_priority: 100
        arguments:
            $decorated: '@.inner'
            $requestStack: '@request_stack'

    tenant_context_refund_payment_processor:
        class: App\Shared\Infrastructure\ApiPlatform\State\TenantContextProcessor
        decorates: App\Payment\Presentation\Api\Processor\RefundPaymentProcessor
        decoration_priority: 100
        arguments:
            $decorated: '@.inner'
            $requestStack: '@request_stack'

    tenant_context_cancel_payment_processor:
        class: App\Shared\Infrastructure\ApiPlatform\State\TenantContextProcessor
        decorates: App\Payment\Presentation\Api\Processor\CancelPaymentProcessor
        decoration_priority: 100
        arguments:
            $decorated: '@.inner'
            $requestStack: '@request_stack'

    # Payment Context - Event Subscribers
    App\Payment\Application\EventSubscriber\PaymentAuthorizedSubscriber:
        arguments:
            $logger: '@logger'
        tags:
            - { name: kernel.event_subscriber }

    App\Payment\Application\EventSubscriber\PaymentCapturedSubscriber:
        arguments:
            $mailer: '@mailer.mailer'
            $logger: '@logger'
            $senderEmail: 'payments@ecommerce.local'
            $senderName: 'E-Commerce Platform'
        tags:
            - { name: kernel.event_subscriber }

    App\Payment\Application\EventSubscriber\PaymentRefundedSubscriber:
        arguments:
            $mailer: '@mailer.mailer'
            $logger: '@logger'
            $senderEmail: 'payments@ecommerce.local'
            $senderName: 'E-Commerce Platform'
        tags:
            - { name: kernel.event_subscriber }

    App\Payment\Application\EventSubscriber\PaymentFailedSubscriber:
        arguments:
            $mailer: '@mailer.mailer'
            $logger: '@logger'
            $senderEmail: 'payments@ecommerce.local'
            $senderName: 'E-Commerce Platform'
        tags:
            - { name: kernel.event_subscriber }

    App\Payment\Application\EventSubscriber\PaymentCancelledSubscriber:
        arguments:
            $mailer: '@mailer.mailer'
            $logger: '@logger'
            $senderEmail: 'payments@ecommerce.local'
            $senderName: 'E-Commerce Platform'
        tags:
            - { name: kernel.event_subscriber }

    # Stripe Webhook Handler
    App\Payment\Infrastructure\Webhook\StripeWebhookHandler:
        arguments:
            $webhookSecret: '%env(STRIPE_WEBHOOK_SECRET)%'
            $commandBus: '@command.bus'
            $queryBus: '@query.bus'
            $logger: '@logger'

    # Tax Context - Repository
    App\Tax\Domain\Repository\TaxRuleRepositoryInterface:
        alias: App\Tax\Infrastructure\Persistence\Doctrine\Repository\DoctrineORMTaxRuleRepository

    App\Tax\Infrastructure\Persistence\Doctrine\Repository\DoctrineORMTaxRuleRepository:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'
            $eventDispatcher: '@event_dispatcher'

    # Tax Context - Domain Services
    App\Tax\Domain\Service\TaxCalculationService:
        arguments:
            $taxRuleRepository: '@App\Tax\Domain\Repository\TaxRuleRepositoryInterface'

    # Returns Context - Repository
    App\Returns\Domain\Repository\ReturnRequestRepositoryInterface:
        alias: App\Returns\Infrastructure\Persistence\Doctrine\Repository\DoctrineORMReturnRequestRepository

    App\Returns\Infrastructure\Persistence\Doctrine\Repository\DoctrineORMReturnRequestRepository:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'
            $eventBus: '@messenger.default_bus'

    # Returns Context - Event Subscribers
    App\Returns\Application\EventSubscriber\ReturnRequestCreatedSubscriber:
        arguments:
            $mailer: '@mailer.mailer'
            $logger: '@logger'
            $senderEmail: 'returns@ecommerce.local'
            $senderName: 'E-Commerce Platform - Returns'
        tags:
            - { name: kernel.event_subscriber }

    App\Returns\Application\EventSubscriber\ReturnRequestApprovedSubscriber:
        arguments:
            $mailer: '@mailer.mailer'
            $logger: '@logger'
            $senderEmail: 'returns@ecommerce.local'
            $senderName: 'E-Commerce Platform - Returns'
        tags:
            - { name: kernel.event_subscriber }

    App\Returns\Application\EventSubscriber\ReturnRequestInspectedSubscriber:
        arguments:
            $mailer: '@mailer.mailer'
            $logger: '@logger'
            $senderEmail: 'returns@ecommerce.local'
            $senderName: 'E-Commerce Platform - Returns'
            $commandBus: '@command.bus'
            $returnRequestRepository: '@App\Returns\Domain\Repository\ReturnRequestRepositoryInterface'
        tags:
            - { name: kernel.event_subscriber }

    App\Returns\Application\EventSubscriber\ReturnRequestCompletedSubscriber:
        arguments:
            $mailer: '@mailer.mailer'
            $logger: '@logger'
            $senderEmail: 'returns@ecommerce.local'
            $senderName: 'E-Commerce Platform - Returns'
            $commandBus: '@command.bus'
        tags:
            - { name: kernel.event_subscriber }

    App\Returns\Application\EventSubscriber\ReturnRequestRejectedSubscriber:
        arguments:
            $mailer: '@mailer.mailer'
            $logger: '@logger'
            $senderEmail: 'returns@ecommerce.local'
            $senderName: 'E-Commerce Platform - Returns'
        tags:
            - { name: kernel.event_subscriber }
