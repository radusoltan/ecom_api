# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Shared/Infrastructure/ApiPlatform/State/TenantContextProcessor.php'
            - '../src/Shared/Infrastructure/ApiPlatform/State/TenantContextProvider.php'
            - '../src/Shared/Infrastructure/ApiPlatform/State/CachedCollectionProvider.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Tenant Context Service - for RLS support
    App\Shared\Infrastructure\Tenant\TenantContext:
        shared: true

    # Tenant Context Interface alias for Application layer
    App\Shared\Application\Service\TenantContextInterface:
        alias: App\Shared\Infrastructure\Tenant\TenantContext

    # Prometheus CollectorRegistry alias for autowiring
    Prometheus\CollectorRegistry:
        alias: prometheus_metrics_bundle.collector_registry

    # Translation Service - for multilanguage support
    App\Shared\Application\Service\TranslationService:
        shared: true

    # Gedmo Doctrine Extensions Listeners
    # These listeners enable Translatable and Sluggable behaviors

    gedmo.listener.translatable:
        class: Gedmo\Translatable\TranslatableListener
        tags:
            - { name: doctrine.event_subscriber, connection: default }
        calls:
            - [ setDefaultLocale, [ 'en' ] ]
            - [ setTranslationFallback, [ true ] ]

    gedmo.listener.sluggable:
        class: Gedmo\Sluggable\SluggableListener
        tags:
            - { name: doctrine.event_subscriber, connection: default }

    # Alias for autowiring TranslatableListener
    Gedmo\Translatable\TranslatableListener:
        alias: gedmo.listener.translatable

    # Performance Query Logger - Doctrine DBAL Middleware for query profiling
    App\Shared\Infrastructure\Doctrine\PerformanceQueryLogger:
        arguments:
            $profiler: '@App\Shared\Application\Service\PerformanceProfiler'
        tags:
            - { name: doctrine.middleware }

    # Tenant Connection Middleware - Sets tenant context on every new DB connection
    App\Shared\Infrastructure\Doctrine\TenantConnectionSubscriber:
        tags:
            - { name: doctrine.middleware }

    # API Caching - Cached Collection Provider
    # Note: Decorates the default Doctrine ORM collection provider
    # App\Shared\Infrastructure\ApiPlatform\State\CachedCollectionProvider:
    #     decorates: 'api_platform.doctrine.orm.state.collection_provider'
    #     arguments:
    #         $decorated: '@.inner'
    #         $cacheService: '@App\Shared\Infrastructure\Cache\CacheService'
    #         $requestStack: '@request_stack'
    #         $logger: '@logger'
    # NOTE: Commented out by default. Enable when Redis is configured and ready for production.

    # API Cache Headers Subscriber
    App\Shared\Infrastructure\EventSubscriber\ApiCacheSubscriber:
        tags:
            - { name: kernel.event_subscriber }

    # Tenant Repository - inject event.bus for domain events
    App\Tenant\Infrastructure\Repository\DoctrineORMTenantRepository:
        arguments:
            $eventBus: '@event.bus'

    # Repository interface binding
    App\Tenant\Domain\Repository\TenantRepositoryInterface:
        alias: App\Tenant\Infrastructure\Repository\DoctrineORMTenantRepository

    App\Catalog\Domain\Repository\ProductRepositoryInterface:
        alias: App\Catalog\Infrastructure\Persistence\Doctrine\Repository\DoctrineProductRepository

    App\Catalog\Domain\Repository\CategoryRepositoryInterface:
        alias: App\Catalog\Infrastructure\Persistence\Doctrine\Repository\DoctrineCategoryRepository

    App\Media\Domain\Repository\ImageRepositoryInterface:
        alias: App\Media\Infrastructure\Persistence\Doctrine\Repository\DoctrineImageRepository

    App\Media\Domain\Service\ThumbnailPolicy:
        alias: App\Media\Domain\Service\DefaultThumbnailPolicy

    App\Media\Domain\Service\DefaultThumbnailPolicy: ~

    App\Media\Domain\Service\ImageStorage:
        alias: App\Media\Infrastructure\Storage\LocalImageStorage

    App\Media\Infrastructure\Storage\LocalImageStorage:
        arguments:
            $basePath: '%media.storage.local.base_path%'
            $publicPrefix: '%media.storage.local.public_prefix%'

    App\Media\Domain\Service\ThumbnailGenerator:
        alias: App\Media\Infrastructure\Thumbnail\LocalThumbnailGenerator

    App\Media\Infrastructure\Thumbnail\LocalThumbnailGenerator:
        arguments:
            $basePath: '%media.thumbnail.local.base_path%'
            $publicPrefix: '%media.thumbnail.local.public_prefix%'
            $originalBasePath: '%media.storage.local.base_path%'
            $originalPublicPrefix: '%media.storage.local.public_prefix%'

    App\Media\Domain\Service\ImageSecurityPolicy:
        alias: App\Media\Infrastructure\Security\TenantAwareImageSecurityPolicy

    App\Media\Infrastructure\Security\TenantAwareImageSecurityPolicy:
        arguments:
            $tenantContext: '@App\Media\Infrastructure\Security\TenantContextInterface'

    App\Media\Infrastructure\Security\TenantContextInterface:
        alias: App\Media\Application\Security\HeaderTenantContext

    App\Media\Application\Security\HeaderTenantContext: ~

    App\Media\Infrastructure\MessageHandler\DeleteImageAssetsHandler:
        arguments:
            $originalBasePath: '%media.storage.local.base_path%'
            $originalPublicPrefix: '%media.storage.local.public_prefix%'
            $thumbnailBasePath: '%media.thumbnail.local.base_path%'
            $thumbnailPublicPrefix: '%media.thumbnail.local.public_prefix%'
        tags:
            - { name: messenger.message_handler }

    App\Media\Infrastructure\MessageHandler\GenerateThumbnailsHandler:
        tags:
            - { name: messenger.message_handler }

    App\Media\Presentation\Api\State\ImageUploadProcessor:
        arguments:
            $messageBus: '@messenger.default_bus'
            $asyncThumbnails: '%env(bool:ASYNC_THUMBNAILS)%'

    App\Media\Presentation\Api\State\RegenerateThumbnailsProcessor:
        arguments:
            $messageBus: '@messenger.default_bus'
            $validator: '@validator'
            $asyncThumbnails: '%env(bool:ASYNC_THUMBNAILS)%'

    App\Shared\Infrastructure\Tenant\TenantRequestSubscriber:
        tags:
            - { name: kernel.event_subscriber }

    App\Catalog\Infrastructure\EventSubscriber\StorefrontCacheSubscriber:
        tags:
            - { name: kernel.event_subscriber }

    App\Media\Infrastructure\Serializer\MultipartDecoder:
        tags:
            - { name: serializer.encoder, format: multipart }

    App\Media\Infrastructure\Serializer\UploadedFileDenormalizer:
        tags:
            - { name: serializer.normalizer }

    App\Media\Infrastructure\Serializer\MediaObjectNormalizer:
        tags:
            - { name: serializer.normalizer, priority: 64 }

    # Order Repository - inject event dispatcher for domain events
    App\Order\Infrastructure\Persistence\Doctrine\Repository\DoctrineORMOrderRepository:
        arguments:
            $eventDispatcher: '@event_dispatcher'

    # Order Repository interface binding
    App\Order\Domain\Repository\OrderRepositoryInterface:
        alias: App\Order\Infrastructure\Persistence\Doctrine\Repository\DoctrineORMOrderRepository

    # Cart Repository - inject event dispatcher for domain events
    App\Cart\Infrastructure\Persistence\Doctrine\Repository\DoctrineCartRepository:
        arguments:
