    # Decorate providers with TenantContext to inject X-Tenant-ID header into context
    App\Shared\Infrastructure\ApiPlatform\State\TenantContextProvider:
        decorates: App\Order\Presentation\Api\Provider\OrderItemProvider
        arguments:
            $decorated: '@.inner'
            $requestStack: '@request_stack'

    tenant_context_collection_provider:
        class: App\Shared\Infrastructure\ApiPlatform\State\TenantContextProvider
        decorates: App\Order\Presentation\Api\Provider\OrderCollectionProvider
        arguments:
            $decorated: '@.inner'
            $requestStack: '@request_stack'

    # Order Event Subscribers
    # These subscribers listen to domain events and perform side effects
    # (emails, notifications, integrations)

    App\Order\Application\EventSubscriber\OrderPlacedSubscriber:
        arguments:
            $mailer: '@mailer.mailer'
            $logger: '@logger'
            $senderEmail: 'orders@ecommerce.local'
            $senderName: 'E-Commerce Platform'
        tags:
            - { name: kernel.event_subscriber }

    App\Order\Application\EventSubscriber\OrderStatusChangedSubscriber:
        arguments:
            $mailer: '@mailer.mailer'
            $logger: '@logger'
            $senderEmail: 'orders@ecommerce.local'
            $senderName: 'E-Commerce Platform'
        tags:
