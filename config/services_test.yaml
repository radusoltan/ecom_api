services:
    # Override Payment Gateways with Fake implementations for testing
    # This prevents actual API calls to Stripe/PayPal during tests

    # Completely replace StripeGateway with FakeStripeGateway
    App\Payment\Infrastructure\Gateway\StripeGateway:
        class: App\Payment\Infrastructure\Gateway\FakeStripeGateway
        public: false
        autowire: false
        autoconfigure: false
        arguments:
            $logger: '@logger'

    # Completely replace PayPalGatewayAdapter with FakePayPalGateway
    App\Payment\Infrastructure\Gateway\PayPalGatewayAdapter:
        class: App\Payment\Infrastructure\Gateway\FakePayPalGateway
        public: false
        autowire: false
        autoconfigure: false
        arguments:
            $logger: '@logger'

    # RLS bypass listener for test environment
    # Sets app.bypass_rls = 'true' on every request so tenant queries work
    App\Shared\Infrastructure\Tenant\TestRLSBypassListener:
        autowire: true
        tags:
            - { name: kernel.event_subscriber }
