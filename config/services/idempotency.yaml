services:
    # Idempotency Middleware
    App\Shared\Infrastructure\Http\Middleware\IdempotencyMiddleware:
        arguments:
            $cache: '@cache.app'
            $logger: '@monolog.logger.idempotency'
        tags:
            - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: 32 }
            - { name: kernel.event_listener, event: kernel.response, method: onKernelResponse, priority: -32 }

    # Dedicated logger channel for idempotency
    monolog.logger.idempotency:
        parent: monolog.logger
        arguments:
            - 'idempotency'
