tags:
  -
    name: Cart
    description: 'Shopping cart management for e-commerce platform. Supports guest and authenticated users with automatic cart creation and merging.'
  -
    name: ProductAutocomplete
    description: "Resource 'ProductAutocomplete' operations."
  -
    name: ProductOptions
    description: |-
      API Resource for Product Configuration Options

      Exposes all unique product options (color, size, etc.) across the catalog
      for use in product filtering and search interfaces.

      Example response:
      [
        {
          "code": "color",
          "name": "Color",
          "nameTranslations": {"en": "Color", "fr": "Couleur", "de": "Farbe"},
          "values": [
            {
              "code": "red",
              "name": "Red",
              "nameTranslations": {"en": "Red", "fr": "Rouge", "de": "Rot"}
            },
            {
              "code": "blue",
              "name": "Blue",
              "nameTranslations": {"en": "Blue", "fr": "Bleu", "de": "Blau"}
            }
          ]
        },
        {
          "code": "size",
          "name": "Size",
          "nameTranslations": {"en": "Size", "fr": "Taille", "de": "Größe"},
          "values": [
            {
              "code": "s",
              "name": "Small",
              "nameTranslations": {"en": "Small", "fr": "Petit", "de": "Klein"}
            }
          ]
        }
      ]

      Query parameters:
      - locale: Language code for localized names (en, fr, de) - defaults to Accept-Language header
  -
    name: ProductSearch
    description: "Resource 'ProductSearch' operations."
  -
    name: ProductTranslation
    description: |-
      API resource for product translations
      Provides endpoints for managing translations of product content
  -
    name: Category
    description: "Resource 'Category' operations."
  -
    name: ProductEntity
    description: "Resource 'ProductEntity' operations."
  -
    name: StorefrontCategory
    description: "Resource 'StorefrontCategory' operations."
  -
    name: StorefrontProduct
    description: "Resource 'StorefrontProduct' operations."
  -
    name: Customer
    description: "Resource 'Customer' operations."
  -
    name: DashboardStats
    description: "Resource 'DashboardStats' operations."
  -
    name: Translation
    description: |-
      API Resource for Translation Strings

      Exposes Symfony translations to frontend applications via REST API.
      Supports multiple domains (messages, validators, emails) and locales (en, fr, de).

      Example endpoints:
      - GET /api/translations?domain=messages&locale=en
      - GET /api/translations?domain=validators&locale=fr
      - GET /api/translations (all domains, default locale)
  -
    name: InventoryStats
    description: "Resource 'InventoryStats' operations."
  -
    name: BulkStockOperation
    description: |-
      API Resource for Bulk Stock Operations

      Handles bulk operations on multiple stock items in a single request.

      REST Endpoints:
      - POST /api/stock/bulk-reserve - Reserve multiple items atomically

      GraphQL Operations:
      - Mutation: bulkReserveStock - Reserve multiple items in one operation
  -
    name: StockItem
    description: |-
      API Resource for Stock Items

      Represents inventory stock for a product at a specific warehouse.

      REST Endpoints:
      - GET /api/stock-items/{id} - Get stock item details
      - GET /api/stock-items?productId=xxx&warehouseId=yyy - Query stock
      - POST /api/stock-items - Create new stock item

      GraphQL Operations:
      - Query: stockItem(id: ID!) - Get single stock item
      - Query: stockItems - List all stock items (with pagination)
      - Mutation: createStockItem - Create new stock item
  -
    name: StockOperation
    description: |-
      API Resource for Stock Operations

      Handles reserve, allocate, and release operations on stock items.

      REST Endpoints:
      - POST /api/stock/reserve - Reserve stock (soft hold for cart)
      - POST /api/stock/allocate - Allocate stock (hard allocation for order)
      - POST /api/stock/release - Release reserved/allocated stock

      GraphQL Operations:
      - Mutation: reserveStock - Reserve stock for cart
      - Mutation: allocateStock - Allocate stock for order
      - Mutation: releaseStock - Release reserved/allocated stock
  -
    name: Warehouse
    description: "Resource 'Warehouse' operations."
  -
    name: MediaImage
    description: "Resource 'MediaImage' operations."
  -
    name: FulfillmentEntity
    description: "Resource 'FulfillmentEntity' operations."
  -
    name: Order
    description: "Resource 'Order' operations."
  -
    name: Payment
    description: "Resource 'Payment' operations."
  -
    name: Promotion
    description: "Resource 'Promotion' operations."
  -
    name: PriceList
    description: "Resource 'PriceList' operations."
  -
    name: ReturnRequest
    description: |-
      API Platform Resource for ReturnRequest.

      Exposes REST endpoints for return management.
  -
    name: TaxCalculation
    description: |-
      Tax Calculation API Resource

      Represents a tax calculation request and response.
  -
    name: TaxRule
    description: |-
      Tax Rule API Resource

      Represents tax rules for multi-jurisdiction tax calculation.
