      summary: 'Remove item from cart'
      description: 'Remove a specific item from the cart'
      parameters:
        -
          name: itemId
          in: path
          description: 'Cart item identifier to remove'
          required: true
          deprecated: false
          schema:
            type: string
            format: uuid
          style: simple
          explode: false
        -
          name: X-Cart-ID
          in: header
          description: 'Cart identifier'
          required: true
          deprecated: false
          schema:
            type: string
            format: uuid
          style: simple
          explode: false
        -
          name: id
          in: path
          description: 'Cart identifier'
          required: true
          deprecated: false
          schema:
            type: string
          style: simple
          explode: false
    patch:
      operationId: api_cartitems_itemId_patch
      tags:
        - Cart
      responses:
        '200':
          description: 'Quantity updated successfully'
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/Cart.jsonld'
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
            multipart/form-data: {  }
          links: {  }
        '400':
          description: 'Invalid quantity'
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/Error.jsonld'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          links: {  }
        '404':
          description: 'Cart item not found'
        '409':
          description: 'Insufficient stock for requested quantity'
        '422':
          description: 'An error occurred'
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/ConstraintViolation.jsonld'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConstraintViolation'
            application/json:
              schema:
                $ref: '#/components/schemas/ConstraintViolation'
          links: {  }
      summary: 'Update cart item quantity'
      description: 'Update the quantity of an existing cart item. Stock availability is validated before update.'
      parameters:
        -
          name: itemId
          in: path
          description: 'Cart item identifier'
          required: true
          deprecated: false
          schema:
            type: string
            format: uuid
          style: simple
          explode: false
        -
          name: X-Cart-ID
          in: header
          description: 'Cart identifier'
          required: true
          deprecated: false
          schema:
            type: string
            format: uuid
          style: simple
          explode: false
        -
          name: id
          in: path
          description: 'Cart identifier'
          required: true
          deprecated: false
          schema:
            type: string
          style: simple
          explode: false
      requestBody:
        description: 'The updated Cart resource'
        content:
          application/json:
            schema:
              type: object
              required:
                - tenantId
                - newQuantity
              properties:
                tenantId:
                  type: string
                  format: uuid
                newQuantity:
                  type: integer
                  minimum: 1
                  maximum: 999
                  example: 5
        required: false
