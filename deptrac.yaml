      - Catalog_Domain      # Product/Category/Bundle/Variant events
      - Customer_Domain     # Customer/Loyalty/AccountDeletion events
      - Inventory_Domain    # Stock/Warehouse events
      - Tenant_Domain       # Tenant/FeatureFlag events
      - Cart_Domain         # Cart item events
      - Shipping_Domain     # Shipment events
      - Invoice_Domain      # Invoice events
      - Returns_Domain      # Return request events
      - Privacy_Domain      # Consent/DataSubjectRequest events
      - Notifications_Domain # Notification events
