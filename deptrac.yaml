deptrac:
  paths:
    - ./src

  exclude_files:
    - '#.*test.*#'
    - '#.*DataFixtures.*#'
    - '#.*Fixtures.*#'

  layers:
    # =========================================================================
    # Shared Kernel
    # =========================================================================
    - name: Shared_Domain
      collectors:
        - type: directory
          value: src/Shared/Domain/.*

    - name: Shared_Application
      collectors:
        - type: directory
          value: src/Shared/Application/.*

    - name: Shared_Infrastructure
      collectors:
        - type: directory
          value: src/Shared/Infrastructure/.*

    # =========================================================================
    # Tenant Context
    # =========================================================================
    - name: Tenant_Domain
      collectors:
        - type: directory
          value: src/Tenant/Domain/.*

    - name: Tenant_Application
      collectors:
        - type: directory
          value: src/Tenant/Application/.*

    - name: Tenant_Infrastructure
      collectors:
        - type: directory
          value: src/Tenant/Infrastructure/.*

    - name: Tenant_Presentation
      collectors:
        - type: directory
          value: src/Tenant/Presentation/.*

    # =========================================================================
    # User Context
    # =========================================================================
    - name: User_Domain
      collectors:
        - type: directory
          value: src/User/Domain/.*

    - name: User_Application
      collectors:
        - type: directory
          value: src/User/Application/.*

    - name: User_Infrastructure
      collectors:
        - type: directory
          value: src/User/Infrastructure/.*

    - name: User_Presentation
      collectors:
        - type: directory
          value: src/User/Presentation/.*

    # =========================================================================
    # Catalog Context
    # =========================================================================
    - name: Catalog_Domain
      collectors:
        - type: directory
          value: src/Catalog/Domain/.*

    - name: Catalog_Application
      collectors:
        - type: directory
          value: src/Catalog/Application/.*

    - name: Catalog_Infrastructure
      collectors:
        - type: directory
          value: src/Catalog/Infrastructure/.*

    - name: Catalog_Presentation
      collectors:
        - type: directory
          value: src/Catalog/Presentation/.*

    # =========================================================================
    # Order Context
    # =========================================================================
    - name: Order_Domain
      collectors:
        - type: directory
          value: src/Order/Domain/.*

    - name: Order_Application
      collectors:
        - type: directory
          value: src/Order/Application/.*

    - name: Order_Infrastructure
      collectors:
        - type: directory
          value: src/Order/Infrastructure/.*

    - name: Order_Presentation
      collectors:
        - type: directory
          value: src/Order/Presentation/.*

    # =========================================================================
    # Inventory Context
    # =========================================================================
    - name: Inventory_Domain
      collectors:
        - type: directory
          value: src/Inventory/Domain/.*

    - name: Inventory_Application
      collectors:
        - type: directory
          value: src/Inventory/Application/.*

    - name: Inventory_Infrastructure
      collectors:
        - type: directory
          value: src/Inventory/Infrastructure/.*

    - name: Inventory_Presentation
      collectors:
        - type: directory
          value: src/Inventory/Presentation/.*

    # =========================================================================
    # Pricing Context
    # =========================================================================
    - name: Pricing_Domain
      collectors:
        - type: directory
          value: src/Pricing/Domain/.*

    - name: Pricing_Application
      collectors:
        - type: directory
          value: src/Pricing/Application/.*

    - name: Pricing_Infrastructure
      collectors:
        - type: directory
          value: src/Pricing/Infrastructure/.*

    - name: Pricing_Presentation
      collectors:
        - type: directory
          value: src/Pricing/Presentation/.*

    # =========================================================================
    # Customer Context
    # =========================================================================
    - name: Customer_Domain
      collectors:
        - type: directory
          value: src/Customer/Domain/.*

    - name: Customer_Application
      collectors:
        - type: directory
          value: src/Customer/Application/.*

    - name: Customer_Infrastructure
      collectors:
        - type: directory
          value: src/Customer/Infrastructure/.*

    - name: Customer_Presentation
      collectors:
        - type: directory
          value: src/Customer/Presentation/.*

    # =========================================================================
    # Payment Context
    # =========================================================================
    - name: Payment_Domain
      collectors:
        - type: directory
          value: src/Payment/Domain/.*

    - name: Payment_Application
      collectors:
        - type: directory
          value: src/Payment/Application/.*

    - name: Payment_Infrastructure
      collectors:
        - type: directory
          value: src/Payment/Infrastructure/.*

    - name: Payment_Presentation
      collectors:
        - type: directory
          value: src/Payment/Presentation/.*

    # =========================================================================
    # Tax Context
    # =========================================================================
    - name: Tax_Domain
      collectors:
        - type: directory
          value: src/Tax/Domain/.*

    - name: Tax_Application
      collectors:
        - type: directory
          value: src/Tax/Application/.*

    - name: Tax_Infrastructure
      collectors:
        - type: directory
          value: src/Tax/Infrastructure/.*

    - name: Tax_Presentation
      collectors:
        - type: directory
          value: src/Tax/Presentation/.*

    # =========================================================================
    # Invoice Context (no Presentation layer)
    # =========================================================================
    - name: Invoice_Domain
      collectors:
        - type: directory
          value: src/Invoice/Domain/.*

    - name: Invoice_Application
      collectors:
        - type: directory
          value: src/Invoice/Application/.*

    - name: Invoice_Infrastructure
      collectors:
        - type: directory
          value: src/Invoice/Infrastructure/.*

    # =========================================================================
    # Returns Context
    # =========================================================================
    - name: Returns_Domain
      collectors:
        - type: directory
          value: src/Returns/Domain/.*

    - name: Returns_Application
      collectors:
        - type: directory
          value: src/Returns/Application/.*

    - name: Returns_Infrastructure
      collectors:
        - type: directory
          value: src/Returns/Infrastructure/.*

    - name: Returns_Presentation
      collectors:
        - type: directory
          value: src/Returns/Presentation/.*

    # =========================================================================
    # Cart Context
    # =========================================================================
    - name: Cart_Domain
      collectors:
        - type: directory
          value: src/Cart/Domain/.*

    - name: Cart_Application
      collectors:
        - type: directory
          value: src/Cart/Application/.*

    - name: Cart_Infrastructure
      collectors:
        - type: directory
          value: src/Cart/Infrastructure/.*

    - name: Cart_Presentation
      collectors:
        - type: directory
          value: src/Cart/Presentation/.*

    # =========================================================================
    # Notifications Context (no Presentation layer)
    # =========================================================================
    - name: Notifications_Domain
      collectors:
        - type: directory
          value: src/Notifications/Domain/.*

    - name: Notifications_Application
      collectors:
        - type: directory
          value: src/Notifications/Application/.*

    - name: Notifications_Infrastructure
      collectors:
        - type: directory
          value: src/Notifications/Infrastructure/.*

    # =========================================================================
    # Search Context
    # =========================================================================
    - name: Search_Domain
      collectors:
        - type: directory
          value: src/Search/Domain/.*

    - name: Search_Application
      collectors:
        - type: directory
          value: src/Search/Application/.*

    - name: Search_Infrastructure
      collectors:
        - type: directory
          value: src/Search/Infrastructure/.*

    - name: Search_Presentation
      collectors:
        - type: directory
          value: src/Search/Presentation/.*

    # =========================================================================
    # AuditLog Context (no Presentation layer)
    # =========================================================================
    - name: AuditLog_Domain
      collectors:
        - type: directory
          value: src/AuditLog/Domain/.*

    - name: AuditLog_Application
      collectors:
        - type: directory
          value: src/AuditLog/Application/.*

    - name: AuditLog_Infrastructure
      collectors:
        - type: directory
          value: src/AuditLog/Infrastructure/.*

    # =========================================================================
    # Privacy Context
    # =========================================================================
    - name: Privacy_Domain
      collectors:
        - type: directory
          value: src/Privacy/Domain/.*

    - name: Privacy_Application
      collectors:
        - type: directory
          value: src/Privacy/Application/.*

    - name: Privacy_Infrastructure
      collectors:
        - type: directory
          value: src/Privacy/Infrastructure/.*

    - name: Privacy_Presentation
      collectors:
        - type: directory
          value: src/Privacy/Presentation/.*

    # =========================================================================
    # Media Context
    # =========================================================================
    - name: Media_Domain
      collectors:
        - type: directory
          value: src/Media/Domain/.*

    - name: Media_Application
      collectors:
        - type: directory
          value: src/Media/Application/.*

    - name: Media_Infrastructure
      collectors:
        - type: directory
          value: src/Media/Infrastructure/.*

    - name: Media_Presentation
      collectors:
        - type: directory
          value: src/Media/Presentation/.*

    # =========================================================================
    # Wishlist Context
    # =========================================================================
    - name: Wishlist_Domain
      collectors:
        - type: directory
          value: src/Wishlist/Domain/.*

    - name: Wishlist_Application
      collectors:
        - type: directory
          value: src/Wishlist/Application/.*

    - name: Wishlist_Infrastructure
      collectors:
        - type: directory
          value: src/Wishlist/Infrastructure/.*

    - name: Wishlist_Presentation
      collectors:
        - type: directory
          value: src/Wishlist/Presentation/.*

    # =========================================================================
    # Review Context
    # =========================================================================
    - name: Review_Domain
      collectors:
        - type: directory
          value: src/Review/Domain/.*

    - name: Review_Application
      collectors:
        - type: directory
          value: src/Review/Application/.*

    - name: Review_Infrastructure
      collectors:
        - type: directory
          value: src/Review/Infrastructure/.*

    - name: Review_Presentation
      collectors:
        - type: directory
          value: src/Review/Presentation/.*

    # =========================================================================
    # Internationalization Context (no Presentation layer)
    # =========================================================================
    - name: Internationalization_Domain
      collectors:
        - type: directory
          value: src/Internationalization/Domain/.*

    - name: Internationalization_Application
      collectors:
        - type: directory
          value: src/Internationalization/Application/.*

    - name: Internationalization_Infrastructure
      collectors:
        - type: directory
          value: src/Internationalization/Infrastructure/.*

    # =========================================================================
    # Monitoring Context
    # =========================================================================
    - name: Monitoring_Domain
      collectors:
        - type: directory
          value: src/Monitoring/Domain/.*

    - name: Monitoring_Application
      collectors:
        - type: directory
          value: src/Monitoring/Application/.*

    - name: Monitoring_Infrastructure
      collectors:
        - type: directory
          value: src/Monitoring/Infrastructure/.*

    - name: Monitoring_Presentation
      collectors:
        - type: directory
          value: src/Monitoring/Presentation/.*

    # =========================================================================
    # Shipping Context
    # =========================================================================
    - name: Shipping_Domain
      collectors:
        - type: directory
          value: src/Shipping/Domain/.*

    - name: Shipping_Application
      collectors:
        - type: directory
          value: src/Shipping/Application/.*

    - name: Shipping_Infrastructure
      collectors:
        - type: directory
          value: src/Shipping/Infrastructure/.*

    - name: Shipping_Presentation
      collectors:
        - type: directory
          value: src/Shipping/Presentation/.*

    # =========================================================================
    # Dashboard Context (no Domain or Infrastructure layer)
    # =========================================================================
    - name: Dashboard_Application
      collectors:
        - type: directory
          value: src/Dashboard/Application/.*

    - name: Dashboard_Presentation
      collectors:
        - type: directory
          value: src/Dashboard/Presentation/.*

    # =========================================================================
    # Vendor / External Dependencies
    # =========================================================================
    - name: Vendor
      collectors:
        - type: classLike
          value: ^Symfony\\
        - type: classLike
          value: ^Doctrine\\
        - type: classLike
          value: ^ApiPlatform\\
        - type: classLike
          value: ^Psr\\
        - type: classLike
          value: ^Brick\\
        - type: classLike
          value: ^Gedmo\\
        - type: classLike
          value: ^Stripe\\
        - type: classLike
          value: ^OpenTelemetry\\
        - type: classLike
          value: ^Webmozart\\
        - type: classLike
          value: ^Elastic\\
        - type: classLike
          value: ^Prometheus\\
        - type: classLike
          value: ^Twig\\
        - type: classLike
          value: ^Lexik\\
        - type: classLike
          value: ^Gesdinet\\
        - type: classLike
          value: ^OTPHP\\
        - type: classLike
          value: ^Endroid\\
        - type: classLike
          value: ^Dompdf\\
        - type: classLike
          value: ^Monolog\\

    # =========================================================================
    # DataFixtures (outside bounded contexts)
    # =========================================================================
    - name: DataFixtures
      collectors:
        - type: directory
          value: src/DataFixtures/.*

    # =========================================================================
    # Tests (referenced from src, e.g. NullMercureHub)
    # =========================================================================
    - name: TestStubs
      collectors:
        - type: classLike
          value: ^App\\Tests\\

  # ===========================================================================
  # Skip violations for known test-infrastructure dependencies
  # ===========================================================================
  skip_violations:
    App\Inventory\Infrastructure\EventSubscriber\StockLevelChangeNotificationSubscriber:
      - App\Tests\Stub\NullMercureHub  # Test-only guard clause, acceptable

  # ===========================================================================
  # RULESET: Allowed dependencies per layer
  # ===========================================================================
  ruleset:
    # -----------------------------------------------------------------------
    # Shared Kernel — no external dependencies for Domain
    # -----------------------------------------------------------------------
    Shared_Domain:
      - Vendor

    Shared_Application:
      - Vendor
      - Shared_Domain
    Shared_Infrastructure:
      - Vendor
      - Shared_Domain
      - Shared_Application
      - Internationalization_Domain          # Locale in IndexManager, CacheWarmingService
      - Internationalization_Infrastructure  # TranslatableHelper → Translation entity
      # ApiProblemExceptionListener maps domain exceptions to HTTP status codes
      - Catalog_Domain
      - Cart_Domain
      - Payment_Domain
      - Order_Domain
      - Tenant_Domain
      - User_Domain
      - Shipping_Domain
    # -----------------------------------------------------------------------
    # Tenant Context
    # -----------------------------------------------------------------------
    Tenant_Domain:
      - Vendor
      - Shared_Domain
    Tenant_Application:
      - Vendor
      - Tenant_Domain
      - Shared_Domain
      - Shared_Application
      - Shared_Infrastructure  # CacheService used by FeatureFlagService
    Tenant_Infrastructure:
      - Vendor
      - Tenant_Domain
      - Tenant_Application
      - Shared_Domain
      - Shared_Application  # TenantContextLocaleProvider implements Shared locale interface
      - Shared_Infrastructure
      - Internationalization_Infrastructure  # TenantEntity references Translation
    Tenant_Presentation:
      - Vendor
      - Tenant_Application
      - Tenant_Domain
      - Shared_Domain
    # -----------------------------------------------------------------------
    # User Context
    # -----------------------------------------------------------------------
    User_Domain:
      - Vendor
      - Shared_Domain
    User_Application:
      - Vendor
      - User_Domain
      - User_Infrastructure  # PasswordResetTokenEntity, RefreshTokenEntity
      - Shared_Domain
      - Shared_Application
    User_Infrastructure:
      - Vendor
      - User_Domain
      - User_Application
      - User_Presentation    # API Platform entity → processor annotations
      - Shared_Domain
      - Shared_Application  # SecurityUserLocaleProvider implements Shared locale interface
      - Shared_Infrastructure
      - Privacy_Domain  # UserPersonalDataContributor implements Privacy port
    User_Presentation:
      - Vendor
      - User_Application
      - User_Domain
      - User_Infrastructure  # API Platform processors use Doctrine entities
      - Shared_Domain
      - Shared_Infrastructure  # BlindIndexService, TenantContext
    # -----------------------------------------------------------------------
    # Catalog Context
    # -----------------------------------------------------------------------
    Catalog_Domain:
      - Vendor
      - Shared_Domain
      - Internationalization_Domain  # Locale value object
    Catalog_Application:
      - Vendor
      - Catalog_Domain
      - Catalog_Infrastructure   # Elasticsearch indexer, cache, analytics
      - Shared_Domain
      - Shared_Application
      - Shared_Infrastructure    # IndexManager
      - Internationalization_Domain
      - Tenant_Domain            # TenantRepositoryInterface in SkuGenerator
    Catalog_Infrastructure:
      - Vendor
      - Catalog_Domain
      - Catalog_Application
      - Catalog_Presentation     # API Platform entity → provider annotations
      - Shared_Domain
      - Shared_Application
      - Shared_Infrastructure
      - Internationalization_Domain
      - Internationalization_Infrastructure  # Translation entity
      - Tenant_Domain  # Tenant references in entity
    Catalog_Presentation:
      - Vendor
      - Catalog_Application
      - Catalog_Domain
      - Catalog_Infrastructure  # API Platform processors use Doctrine entities
      - Shared_Domain
      - Shared_Infrastructure
    # -----------------------------------------------------------------------
    # Order Context
    # Cross-context: Catalog (ProductId), Inventory (WarehouseId),
    #                Tax (calculation), Customer (notifications)
    # -----------------------------------------------------------------------
    Order_Domain:
      - Vendor
      - Shared_Domain
      - Catalog_Domain       # ProductId shared identifier (ACL boundary conversion)
      - Inventory_Domain     # WarehouseId in Fulfillment
      - Tax_Domain           # TaxCategory, TaxJurisdiction, VatNumber
    Order_Application:
      - Vendor
      - Order_Domain
      - Shared_Domain
      - Shared_Application
      - Shared_Infrastructure    # MetricsCollector
      - Inventory_Domain         # WarehouseId, Quantity in fulfillment
      - Inventory_Application    # AllocateStockCommand
      - Tax_Domain
      - Customer_Application     # NotificationPreferenceService
      - Notifications_Domain     # Notification event subscribers
      - Notifications_Application # SendNotification command
      - Privacy_Domain           # Data compliance
      - Pricing_Application      # PromotionApplicationService
    Order_Infrastructure:
      - Vendor
      - Order_Domain
      - Order_Application
      - Shared_Domain
      - Shared_Infrastructure
      - Catalog_Domain           # ACL adapter bridges to Catalog
      - Inventory_Domain         # ACL adapter bridges to Inventory
      - Pricing_Domain           # Price references
      - Privacy_Domain           # Data compliance
    Order_Presentation:
      - Vendor
      - Order_Application
      - Order_Domain
      - Order_Infrastructure  # API Platform processors use Doctrine entities
      - Shared_Domain
      - Shared_Infrastructure
    # -----------------------------------------------------------------------
    # Inventory Context
    # Cross-context: Catalog (ProductId)
    # -----------------------------------------------------------------------
    Inventory_Domain:
      - Vendor
      - Shared_Domain
      - Catalog_Domain  # ProductId in StockItem
    Inventory_Infrastructure:
      - Vendor
      - Inventory_Domain
      - Inventory_Application
      - Shared_Domain
      - Shared_Infrastructure
      - Catalog_Domain
    # Note: InventoryStatsDto uses Presentation provider reference
    Inventory_Application:
      - Vendor
      - Inventory_Domain
      - Inventory_Presentation   # DTO references
      - Shared_Domain
      - Shared_Application
      - Catalog_Domain
      - Order_Domain  # OrderCancelled event subscriber
    Inventory_Presentation:
      - Vendor
      - Inventory_Application
      - Inventory_Domain
      - Inventory_Infrastructure  # API Platform processors use Doctrine entities
      - Shared_Domain
      - Shared_Infrastructure
    # -----------------------------------------------------------------------
    # Pricing Context
    # Cross-context: Catalog (ProductId), Customer (CustomerSegment)
    # -----------------------------------------------------------------------
    Pricing_Domain:
      - Vendor
      - Shared_Domain
      - Catalog_Domain    # ProductId
      - Customer_Domain   # CustomerSegment
      - User_Domain       # UserId in PriceHistory
    Pricing_Application:
      - Vendor
      - Pricing_Domain
      - Shared_Domain
      - Shared_Application
      - Catalog_Domain
      - Customer_Domain
      - Cart_Domain  # PromotionApplicator operates on Cart
    Pricing_Infrastructure:
      - Vendor
      - Pricing_Domain
      - Pricing_Application
      - Pricing_Presentation  # API Platform entity → processor annotations
      - Shared_Domain
      - Shared_Infrastructure
      - Catalog_Domain
      - Customer_Domain
      - User_Domain  # UserId in PriceHistoryRepository
    Pricing_Presentation:
      - Vendor
      - Pricing_Application
      - Pricing_Domain
      - Pricing_Infrastructure  # API Platform processors use Doctrine entities
      - Shared_Domain
      - Shared_Infrastructure
      - Cart_Domain             # CartId in cart pricing providers
    # -----------------------------------------------------------------------
    # Customer Context — self-contained
    # -----------------------------------------------------------------------
    Customer_Domain:
      - Vendor
      - Shared_Domain
    Customer_Application:
      - Vendor
      - Customer_Domain
      - Customer_Infrastructure  # AddressEntity, DeletionRequestEntity
      - Shared_Domain
      - Shared_Application
      - Order_Domain             # OrderPlaced/OrderPaid events, OrderRepositoryInterface
      - Privacy_Domain           # Privacy event subscribers
    Customer_Infrastructure:
      - Vendor
      - Customer_Domain
      - Customer_Application
      - Customer_Presentation    # API Platform entity → processor annotations
      - Shared_Domain
      - Shared_Infrastructure
      - Privacy_Domain           # GDPR consent integration
      - Privacy_Infrastructure   # Consent repository references
    Customer_Presentation:
      - Vendor
      - Customer_Application
      - Customer_Domain
      - Customer_Infrastructure  # API Platform processors use Doctrine entities
      - Shared_Domain
      - Shared_Application       # TenantContextInterface
      - Shared_Infrastructure    # TenantContext, encryption
      - Order_Domain             # Order references on customer
      - Order_Application
      - User_Domain              # User references
      - User_Infrastructure      # UserEntity in RegisterCustomerProcessor
      - Privacy_Domain           # Consent display
    # -----------------------------------------------------------------------
    # Payment Context
    # Cross-context: Order (status updates, queries)
    # -----------------------------------------------------------------------
    Payment_Domain:
      - Vendor
      - Shared_Domain
    Payment_Application:
      - Vendor
      - Payment_Domain
      - Shared_Domain
      - Shared_Application
      - Shared_Infrastructure  # MetricsCollector
      - Order_Application  # UpdateOrderStatusCommand, GetOrderByIdQuery
      - Order_Domain
    Payment_Infrastructure:
      - Vendor
      - Payment_Domain
      - Payment_Application
      - Payment_Presentation  # API Platform entity → processor annotations
      - Shared_Domain
      - Shared_Application     # TenantContextInterface
      - Shared_Infrastructure
    Payment_Presentation:
      - Vendor
      - Payment_Application
      - Payment_Domain
      - Payment_Infrastructure  # API Platform processors use Doctrine entities
      - Shared_Domain
      - Shared_Infrastructure
      - Order_Application
    # -----------------------------------------------------------------------
    # Tax Context — self-contained
    # -----------------------------------------------------------------------
    Tax_Domain:
      - Vendor
      - Shared_Domain
    Tax_Application:
      - Vendor
      - Tax_Domain
      - Shared_Domain
      - Shared_Application
    Tax_Infrastructure:
      - Vendor
      - Tax_Domain
      - Tax_Application
      - Shared_Domain
      - Shared_Application     # TenantContextInterface
      - Shared_Infrastructure
    Tax_Presentation:
      - Vendor
      - Tax_Application
      - Tax_Domain
      - Tax_Infrastructure  # API Platform processors use Doctrine entities
      - Shared_Domain
      - Shared_Application     # TenantContextInterface
      - Shared_Infrastructure  # TenantContext
    # -----------------------------------------------------------------------
    # Invoice Context (no Presentation layer)
    # Cross-context: Catalog (ProductId), Customer (CustomerId),
    #                Order (OrderId), Payment (events)
    # -----------------------------------------------------------------------
    Invoice_Domain:
      - Vendor
      - Shared_Domain
      - Catalog_Domain    # ProductId in InvoiceLine
      - Customer_Domain   # CustomerId
      - Order_Domain      # OrderId
    Invoice_Application:
      - Vendor
      - Invoice_Domain
      - Shared_Domain
      - Shared_Application
      - Catalog_Domain
      - Customer_Domain
      - Order_Domain
      - Payment_Domain  # PaymentCompleted event subscriber
    Invoice_Infrastructure:
      - Vendor
      - Invoice_Domain
      - Invoice_Application
      - Shared_Domain
      - Shared_Infrastructure
      - Catalog_Domain
      - Customer_Domain
      - Order_Domain
    # -----------------------------------------------------------------------
    # Returns Context
    # Cross-context: Order (OrderId), Payment (refund), Inventory (restock)
    # -----------------------------------------------------------------------
    Returns_Domain:
      - Vendor
      - Shared_Domain
      - Order_Domain  # OrderId
    Returns_Application:
      - Vendor
      - Returns_Domain
      - Shared_Domain
      - Shared_Application
      - Order_Domain
      - Payment_Application    # RefundPayment command
      - Payment_Domain         # PaymentId value object
      # Inventory_Application removed: AdjustStock integration pending (TODO in ReturnRequestInspectedSubscriber)
    Returns_Infrastructure:
      - Vendor
      - Returns_Domain
      - Returns_Application
      - Shared_Domain
      - Shared_Infrastructure
      - Order_Domain
    Returns_Presentation:
      - Vendor
      - Returns_Application
      - Returns_Domain
      - Returns_Infrastructure  # API Platform processors use Doctrine entities
      - Shared_Domain
      - Shared_Infrastructure
      - Payment_Domain
    # -----------------------------------------------------------------------
    # Cart Context
    # Cross-context: Catalog (ProductId), Customer (CustomerId),
    #                Inventory (stock check), Order (checkout), Tax
    # -----------------------------------------------------------------------
    Cart_Domain:
      - Vendor
      - Shared_Domain
      - Catalog_Domain    # ProductId in CartItem
      - Customer_Domain   # CustomerId
    Cart_Application:
      - Vendor
      - Cart_Domain
      - Shared_Domain
      - Shared_Application
      - Shared_Infrastructure  # CacheService
      - Catalog_Domain
      - Customer_Domain
      - Inventory_Domain     # StockItemRepositoryInterface
      - Order_Application    # PlaceOrderCommand
      - Order_Domain
      - Tax_Domain           # TaxCalculationService
    Cart_Infrastructure:
      - Vendor
      - Cart_Domain
      - Cart_Application
      - Shared_Domain
      - Shared_Infrastructure
      - Catalog_Domain
      - Customer_Domain
    Cart_Presentation:
      - Vendor
      - Cart_Application
      - Cart_Domain
      - Cart_Infrastructure  # API Platform processors use Doctrine entities
      - Shared_Domain
      - Shared_Application     # TenantContextInterface
      - Shared_Infrastructure  # TenantContext
      - Order_Application
      - Order_Domain
      - Customer_Domain
    # -----------------------------------------------------------------------
    # Notifications Context (no Presentation layer)
    # Cross-context: subscribes to Order + Payment domain events
    # -----------------------------------------------------------------------
    Notifications_Domain:
      - Vendor
      - Shared_Domain
    Notifications_Application:
      - Vendor
      - Notifications_Domain
      - Shared_Domain
      - Shared_Application
      - Order_Domain    # OrderPlaced, OrderCancelled events
      - Payment_Domain  # PaymentCaptured, PaymentFailed events
    Notifications_Infrastructure:
      - Vendor
      - Notifications_Domain
