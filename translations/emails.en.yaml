# Email templates and notifications (English)
# Domain: emails

common:
  greeting: "Hello {{ name }},"
  closing: "Best regards,"
  signature: "The {{ tenant_name }} Team"
  footer: "If you have any questions, please contact us at {{ support_email }}"
  unsubscribe: "Don't want to receive these emails? Unsubscribe here"

# Order section kept for backwards compatibility with existing code

customer:
  welcome:
    subject: "Welcome to {{ tenant_name }}!"
    title: "Welcome aboard!"
    body: "Thank you for creating an account with us. We're excited to have you as a customer."
    explore: "Start shopping now"

  password_reset:
    subject: "Password Reset Request"
    title: "Reset Your Password"
    body: "We received a request to reset your password. Click the button below to create a new password."
    reset_button: "Reset Password"
    expire: "This link will expire in {{ expire_hours }} hours."
    ignore: "If you didn't request this, please ignore this email."

  account_verified:
    subject: "Email Address Verified"
    title: "Account Verified!"
    body: "Your email address has been successfully verified. You can now enjoy all features of your account."

cart:
  abandoned:
    subject: "You left items in your cart"
    title: "Don't forget about your cart!"
    body: "You have {{ count }} item(s) waiting for you in your cart."
    complete: "Complete your purchase"
    expires: "Items in your cart are reserved for {{ hours }} hours."

notification:
  low_stock:
    subject: "Product back in stock: {{ product_name }}"
    title: "Good news!"
    body: "{{ product_name }} is back in stock. Get it before it's gone again!"
    shop_now: "Shop Now"

emails:
  default_title: 'Notification'

  footer:
    thanks: 'Thank you for shopping with us!'
    company: 'Your E-Commerce Platform'
    visit_site: 'Visit Website'
    contact: 'Contact Support'
    copyright: '© %year% All rights reserved.'

  order:
    order_details: 'Order Details'
    order_id: 'Order ID'
    order_date: 'Order Date'
    total: 'Total'
    status_label: 'Status'
    items: 'Order Items'
    shipping_address: 'Shipping Address'
    shipping_to: 'Shipping To'
    view_order: 'View Order Details'
    payment_details: 'Payment Details'
    payment_date: 'Payment Date'
    amount_paid: 'Amount Paid'
    payment_method: 'Payment Method'
    transaction_id: 'Transaction ID'
    shipping_details: 'Shipping Details'
    shipped_date: 'Shipped Date'
    carrier: 'Carrier'
    tracking_number: 'Tracking Number'
    estimated_delivery: 'Estimated Delivery'
    track_shipment: 'Track Your Shipment'
    cancellation_details: 'Cancellation Details'
    cancelled_date: 'Cancelled Date'
    original_total: 'Original Total'
    reason: 'Reason'
    refund_details: 'Refund Information'
    refund_amount: 'Refund Amount'
    refund_method: 'Refund Method'

    status:
      pending: 'Pending'
      confirmed: 'Confirmed'
      processing: 'Processing'
      paid: 'Paid'
      shipped: 'Shipped'
      delivered: 'Delivered'
      cancelled: 'Cancelled'

    placed:
      title: 'Order Confirmation'
      header: 'Order Confirmed'
      greeting: 'Dear %customer_name%,'
      confirmation: 'Thank you for your order! We have received your order and will process it shortly.'
      next_steps: 'We will send you another email once your payment is confirmed and your order is being prepared for shipment.'
      questions: 'If you have any questions about your order, please don''t hesitate to contact our support team.'

    paid:
      title: 'Payment Confirmed'
      header: 'Payment Received'
      greeting: 'Dear %customer_name%,'
      confirmation: 'We have successfully received your payment. Thank you!'
      next_steps: 'Your order is now being processed and will be shipped soon.'
      processing: 'We will notify you once your order has been shipped with tracking information.'

    shipped:
      title: 'Order Shipped'
      header: 'Your Order Has Shipped'
      greeting: 'Dear %customer_name%,'
      confirmation: 'Great news! Your order has been shipped and is on its way to you.'
      delivery_info: 'You can track your shipment using the tracking number provided above.'
      questions: 'If you have any questions or concerns about your delivery, please contact us.'

    cancelled:
      title: 'Order Cancelled'
      header: 'Order Cancellation'
      greeting: 'Dear %customer_name%,'
      confirmation: 'Your order has been cancelled as requested.'
      refund_time: 'Please allow 5-10 business days for the refund to be processed and appear in your account.'
      apology: 'We apologize for any inconvenience. We hope to serve you again in the future.'
      questions: 'If you have any questions about this cancellation or your refund, please contact our support team.'
