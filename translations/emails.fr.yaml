# Email templates and notifications (French)
# Domain: emails

common:
  greeting: "Bonjour {{ name }},"
  closing: "Cordialement,"
  signature: "L'équipe {{ tenant_name }}"
  footer: "Si vous avez des questions, contactez-nous à {{ support_email }}"
  unsubscribe: "Vous ne souhaitez plus recevoir ces emails ? Désabonnez-vous ici"

order:
  confirmation:
    subject: "Confirmation de commande #{{ order_number }}"
    title: "Merci pour votre commande !"
    body: "Nous avons reçu votre commande #{{ order_number }} et elle est maintenant en cours de traitement."
    view_order: "Voir votre commande"

  shipped:
    subject: "Votre commande #{{ order_number }} a été expédiée"
    title: "Votre commande est en route !"
    body: "Votre commande #{{ order_number }} a été expédiée et devrait arriver le {{ delivery_date }}."
    tracking: "Suivez votre envoi : {{ tracking_url }}"

  delivered:
    subject: "Votre commande #{{ order_number }} a été livrée"
    title: "Votre commande a été livrée !"
    body: "Votre commande #{{ order_number }} a été livrée avec succès."
    feedback: "Comment s'est passée votre expérience ? Laissez un avis"

  cancelled:
    subject: "La commande #{{ order_number }} a été annulée"
    title: "Commande Annulée"
    body: "Votre commande #{{ order_number }} a été annulée comme demandé."
    refund: "Vous recevrez un remboursement dans {{ refund_days }} jours ouvrables."

customer:
  welcome:
    subject: "Bienvenue chez {{ tenant_name }} !"
    title: "Bienvenue !"
    body: "Merci d'avoir créé un compte chez nous. Nous sommes ravis de vous compter parmi nos clients."
    explore: "Commencer vos achats maintenant"

  password_reset:
    subject: "Demande de réinitialisation de mot de passe"
    title: "Réinitialisez votre mot de passe"
    body: "Nous avons reçu une demande de réinitialisation de votre mot de passe. Cliquez sur le bouton ci-dessous pour créer un nouveau mot de passe."
    reset_button: "Réinitialiser le mot de passe"
    expire: "Ce lien expirera dans {{ expire_hours }} heures."
    ignore: "Si vous n'avez pas fait cette demande, veuillez ignorer cet email."

  account_verified:
    subject: "Adresse email vérifiée"
    title: "Compte Vérifié !"
    body: "Votre adresse email a été vérifiée avec succès. Vous pouvez maintenant profiter de toutes les fonctionnalités de votre compte."

cart:
  abandoned:
    subject: "Vous avez laissé des articles dans votre panier"
    title: "N'oubliez pas votre panier !"
    body: "Vous avez {{ count }} article(s) qui vous attendent dans votre panier."
    complete: "Finaliser votre achat"
    expires: "Les articles dans votre panier sont réservés pendant {{ hours }} heures."

notification:
  low_stock:
    subject: "Produit de nouveau en stock : {{ product_name }}"
    title: "Bonne nouvelle !"
    body: "{{ product_name }} est de nouveau en stock. Obtenez-le avant qu'il ne soit à nouveau en rupture !"
    shop_now: "Acheter Maintenant"
